name: Update README

# Daily refresh of profile/README.md's auto-generated sections (see
# scripts/update-readme.mjs): the repository table (from the GitHub API) and
# the software tools tables (imported from robotiq/robotiq.github.io's
# docs/intro.mdx). Opens a PR only when the regenerated content actually
# differs, then merges it — fully automatic, no human review, no bot PAT.
#
# How this merges without a second identity: `prToMain` has a bypass actor
# for the "GitHub Actions" app (mode: pull request), exempting
# github-actions[bot] — the identity GITHUB_TOKEN always acts as — from
# every rule in that ruleset, including the 1-review requirement and the
# `test` required check. A bot still can't literally approve its own PR (a
# GitHub-wide rule a bypass doesn't touch), so this workflow doesn't try
# to; it merges directly, since the rules that would block it don't apply
# to this actor.
#
# Why the `test` check can't be what gates this PR: GitHub does not trigger
# workflow runs from events created by GITHUB_TOKEN, so test.yml
# (on: pull_request) never starts for a PR this workflow opens — its check
# would sit "expected — waiting for status" forever and the merge would
# never happen. The test runs as a step in this job instead, before the PR
# is opened, so a change that breaks update-readme.mjs fails the run here
# and never reaches profile/README.md. test.yml still gates PRs opened by
# humans, where it does run.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test update-readme.mjs
        # This job's own gate — test.yml can't serve as one for the PR this
        # job opens; see the note at the top of this file.
        run: node --test scripts/*.test.mjs

      - name: Regenerate README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-readme.mjs

      - name: Open and merge PR if content changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- profile/README.md; then
            exit 0
          fi

          # Fixed name rather than one timestamped per run: a run that lands
          # before yesterday's PR merged force-pushes onto the same
          # branch/PR instead of piling up a new branch and a new PR each
          # day.
          BRANCH="auto/update-readme"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add profile/README.md
          git commit -m "chore: update README repository table and software tools section"
          git push --force origin "$BRANCH"

          # `// empty` because --jq '.[0].url' prints the literal string
          # "null" on an empty list, which [ -n ] would treat as a hit.
          EXISTING_PR=$(gh pr list --base main --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -n "$EXISTING_PR" ]; then
            PR_URL="$EXISTING_PR"
          else
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: update README repository table" \
              --body "Automated daily refresh of the repository table (GitHub API) and software tools section (robotiq.github.io docs/intro.mdx) — see \`scripts/update-readme.mjs\`.")
          fi

          # Not --auto: with the prToMain bypass there's nothing left to
          # wait on, and a direct merge fails loudly in this run instead of
          # quietly queueing a PR that never lands.
          gh pr merge --squash --delete-branch "$PR_URL"
