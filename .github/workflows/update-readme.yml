name: Update README

# Daily refresh of profile/README.md's auto-generated sections (see
# scripts/update-readme.mjs): the repository table (from the GitHub API) and
# the software tools tables (imported from robotiq/robotiq.github.io's
# docs/intro.mdx). Opens a PR only when the regenerated content actually
# differs; readme-auto-merge.yml then approves and merges it. Fully
# automatic, no human review, no PAT, no bot account, and no ruleset bypass
# — every prToMain rule stays enforced against every actor.
#
# Why the PR is opened with a GitHub App token and not GITHUB_TOKEN:
#
#  1. GitHub does not trigger workflow runs from events created by
#     GITHUB_TOKEN. A PR opened with it would never start test.yml, so the
#     required `test` check would sit "expected — waiting for status"
#     forever and the PR would never become mergeable.
#  2. prToMain requires one approving review, and GitHub blocks a PR's own
#     author from approving it. The approval in readme-auto-merge.yml comes
#     from GITHUB_TOKEN (github-actions[bot]); that only works if some
#     *other* actor opened the PR.
#
# The `robotiq-readme-bot` App satisfies both: it's a distinct actor from
# github-actions[bot], and it isn't tied to anyone's personal account, so
# there's no rotation/offboarding problem. This is the same two-actor shape
# as robotiq.github.io's dependabot-auto-merge.yml, with the App standing in
# for Dependabot.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}

# The App token does all the writing; this job's own GITHUB_TOKEN only needs
# to read the checkout.
permissions:
  contents: read

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          # Persist the App token as the credential git push will use, so
          # the push (and the PR it produces) is attributed to the App.
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate README
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/update-readme.mjs

      - name: Open PR if content changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git diff --quiet -- profile/README.md; then
            exit 0
          fi

          # Fixed name rather than one timestamped per run: a run that lands
          # before yesterday's PR merged force-pushes onto the same
          # branch/PR instead of piling up a new branch and a new PR each
          # day.
          BRANCH="auto/update-readme"

          # The App's bot identity, so the commit is attributed to a real
          # GitHub account — prToMain sets
          # require_extra_approval_for_unattributed_changes, which would
          # demand a second approval for commits it can't attribute.
          git config user.name "robotiq-readme-bot[bot]"
          git config user.email "332551394+robotiq-readme-bot[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add profile/README.md
          git commit -m "chore: update README repository table and software tools section"
          git push --force origin "$BRANCH"

          # `// empty` because --jq '.[0].url' prints the literal string
          # "null" on an empty list, which [ -n ] would treat as a hit.
          EXISTING_PR=$(gh pr list --base main --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -n "$EXISTING_PR" ]; then
            # Already open: the force-push above fires a `synchronize` event,
            # which re-runs readme-auto-merge.yml against it.
            echo "Updated existing PR: $EXISTING_PR"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: update README repository table" \
              --body "Automated daily refresh of the repository table (GitHub API) and software tools section (robotiq.github.io docs/intro.mdx) — see \`scripts/update-readme.mjs\`."
          fi
