name: Update README

# Daily refresh of profile/README.md's auto-generated sections (see
# scripts/update-readme.mjs): the repository table (from the GitHub API) and
# the software tools tables (imported from robotiq/robotiq.github.io's
# docs/intro.mdx). Opens a PR only when the regenerated content actually
# differs, then merges it — fully automatic, no human review, no bot PAT.
#
# How this merges without a second identity: `prToMain` has a bypass actor
# for the "GitHub Actions" app (mode: pull request), exempting
# github-actions[bot] — the identity GITHUB_TOKEN always acts as — from the
# 1-review requirement. A bot still can't literally approve its own PR (a
# GitHub-wide rule bypass doesn't touch), so this workflow doesn't try to;
# it just merges directly, since the rule requiring an approval doesn't
# apply to this actor in the first place.
#
# What still gates the merge: a *separate* ruleset, `requireTests`, targets
# the same branch with only the "test" required status check and NO bypass
# actors — it applies to every actor, bypass or not. Bypassing prToMain's
# review rule doesn't touch it, because ruleset bypass is scoped to the
# whole ruleset it's granted on, not to individual rules within it (that's
# exactly why the check was moved into its own ruleset instead of living
# alongside the bypassed review rule in prToMain — see the discussion on
# PR #2). So a change that breaks update-readme.mjs still sits as an open,
# failing PR instead of reaching the org's public landing page.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-readme.mjs

      - name: Open and merge PR if content changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- profile/README.md; then
            exit 0
          fi

          # Fixed name rather than one timestamped per run: a run that lands
          # before yesterday's PR merged (still waiting on the required
          # check) force-pushes onto the same branch/PR instead of piling
          # up a new branch and a new unmergeable PR each day.
          BRANCH="auto/update-readme"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add profile/README.md
          git commit -m "chore: update README repository table and software tools section"
          git push --force origin "$BRANCH"

          EXISTING_PR=$(gh pr list --base main --head "$BRANCH" --state open --json url --jq '.[0].url')
          if [ -n "$EXISTING_PR" ]; then
            PR_URL="$EXISTING_PR"
          else
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: update README repository table" \
              --body "Automated daily refresh of the repository table (GitHub API) and software tools section (robotiq.github.io docs/intro.mdx) — see \`scripts/update-readme.mjs\`.")
          fi

          gh pr merge --auto --squash --delete-branch "$PR_URL"
