name: Update README

# Daily refresh of profile/README.md's auto-generated sections (see
# scripts/update-readme.mjs): the repository table (from the GitHub API) and
# the software tools tables (imported from robotiq/robotiq.github.io's
# docs/intro.mdx). Opens a PR only when the regenerated content actually
# differs — a human merges it.
#
# Why this doesn't auto-merge: the prToMain ruleset requires 1 approving
# review, and blocks a PR's *author* from approving its own PR. GITHUB_TOKEN
# always acts as github-actions[bot], and this workflow both generates the
# content and would be the one opening the PR — so the author and the only
# available approver would be the same identity. Getting a truly separate
# identity to approve needs either a PAT for a second bot/human account, or
# a ruleset bypass actor for GitHub Actions (which would exempt every
# GITHUB_TOKEN-authored PR in this repo from review, not just this one) —
# both trade one problem for another. Stopping at "PR opens automatically,
# a human clicks merge" needs neither: GITHUB_TOKEN is enough to open the
# PR, and the required `test` check (.github/workflows/test.yml) still
# gates it before that merge is possible.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-readme.mjs

      - name: Open PR if content changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- profile/README.md; then
            exit 0
          fi

          # Fixed name rather than one timestamped per run: a run that lands
          # before yesterday's PR merged force-pushes onto the same
          # branch/PR instead of piling up a new branch and PR each day.
          BRANCH="auto/update-readme"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add profile/README.md
          git commit -m "chore: update README repository table and software tools section"
          git push --force origin "$BRANCH"

          if [ -z "$(gh pr list --base main --head "$BRANCH" --state open --json url --jq '.[0].url')" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: update README repository table" \
              --body "Automated daily refresh of the repository table (GitHub API) and software tools section (robotiq.github.io docs/intro.mdx) — see \`scripts/update-readme.mjs\`. Merge once the \`test\` check passes."
          fi
