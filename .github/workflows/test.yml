name: Test

# Runs scripts/update-readme.test.mjs on every PR into main, as the `test`
# required status check on the prToMain ruleset.
#
# This gates PRs opened by humans. It cannot gate the daily PR opened by
# update-readme.yml: GitHub doesn't trigger workflow runs from events
# created by GITHUB_TOKEN, so this workflow never starts for that PR. That
# run executes these same tests as a step in its own job instead.

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node --test scripts/*.test.mjs
