name: Test

# Runs scripts/update-readme.test.mjs on every PR into main. Intended to be
# added as a required status check on the prToMain ruleset, so a PR that
# breaks scripts/update-readme.mjs (including one opened by
# update-readme.yml's own daily run) can't merge — see the "required check"
# discussion on PR #2.

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node --test scripts/*.test.mjs
