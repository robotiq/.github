name: Test

# Runs scripts/update-readme.test.mjs on every PR into main, as the `test`
# required status check on the prToMain ruleset.
#
# This gates human PRs and the daily automated one alike. The latter only
# works because update-readme.yml opens its PR with a GitHub App token:
# GitHub doesn't trigger workflow runs from events created by GITHUB_TOKEN,
# so a PR opened with that token would never start this workflow and its
# required check would never report — see the note at the top of
# update-readme.yml.

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node --test scripts/*.test.mjs
